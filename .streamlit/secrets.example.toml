# Copy to secrets.toml (git-ignored), or configure Streamlit hosting Secrets.
spreadsheet_id = "YOUR_SPREADSHEET_ID"
[gcp_service_account]
type = "service_account"
project_id = "YOUR_PROJECT_ID"
private_key_id = "YOUR_PRIVATE_KEY_ID"
private_key = """-----BEGIN PRIVATE KEY-----
YOUR_KEY
-----END PRIVATE KEY-----
"""
client_email = "YOUR_ACCOUNT@YOUR_PROJECT.iam.gserviceaccount.com"
client_id = "YOUR_CLIENT_ID"
token_uri = "https://oauth2.googleapis.com/token"

# Configure with your identity provider before selecting the live workspace.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_RANDOM_SECRET"
client_id = "OIDC_CLIENT_ID"
client_secret = "OIDC_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[access."manager@example.com"]
role = "Corporate manager"
projects = []

[access."lead@example.com"]
role = "Project lead"
projects = ["P01", "P02"]
