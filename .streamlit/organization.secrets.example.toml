# Preferred organization mode. Complete these in Streamlit hosting Secrets.
# Do not commit real credentials. No service-account JSON is required.
[application]
enabled = true
public_url = "https://hsepulse-dashboard.streamlit.app"
bootstrap_admin_email = "owner@example.com"
database_url = "postgresql+psycopg://APP_OWNER:PASSWORD@HOST:5432/DATABASE?sslmode=require"
encryption_key = "FERNET_KEY_GENERATED_ONCE_AND_BACKED_UP"

# Google identity login for invited users.
[auth]
redirect_uri = "https://hsepulse-dashboard.streamlit.app/oauth2callback"
cookie_secret = "LONG_RANDOM_COOKIE_SECRET"
client_id = "GOOGLE_WEB_CLIENT_ID"
client_secret = "GOOGLE_WEB_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
client_kwargs = {prompt = "select_account"}

# Master admin's separate Google Sheets authorization (same client is supported).
# Register BOTH redirect URIs in Google Cloud, including the trailing slash below.
[google_connection]
redirect_uri = "https://hsepulse-dashboard.streamlit.app/"
client_id = "GOOGLE_WEB_CLIENT_ID"
client_secret = "GOOGLE_WEB_CLIENT_SECRET"

[smtp]
host = "smtp.example.com"
port = 587
security = "starttls"
username = "SMTP_USERNAME"
password = "SMTP_PASSWORD"
from_email = "HSE Pulse <invites@example.com>"
