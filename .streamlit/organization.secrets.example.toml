# Supabase manages accounts. Google Sheets remains the HSE data source.
[application]
enabled = true
public_url = "https://hsepulse-dashboard.streamlit.app"
bootstrap_admin_email = "owner@example.com"
encryption_key = "FERNET_KEY_GENERATED_ONCE_AND_BACKED_UP"

[supabase]
url = "https://PROJECT_REF.supabase.co"
publishable_key = "sb_publishable_REPLACE_ME"
# Server-only key for issuing invitations. Never embed in frontend code.
secret_key = "sb_secret_REPLACE_ME"

# One-time server credential. Share each master sheet with client_email as Editor.
[gcp_service_account]
type = "service_account"
project_id = "YOUR_GOOGLE_PROJECT"
private_key_id = "KEY_ID"
private_key = "PRIVATE_KEY_FROM_JSON"
client_email = "hsepulse-sheets@YOUR_GOOGLE_PROJECT.iam.gserviceaccount.com"
client_id = "SERVICE_ACCOUNT_CLIENT_ID"
token_uri = "https://oauth2.googleapis.com/token"
